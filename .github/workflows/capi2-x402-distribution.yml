name: capi2 x402 directory distribution

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capi2-x402-distribution.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Register capi2 endpoints with 402 Index
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          registrations = [
              {
                  "url": "https://capi2-claim-verify.onrender.com/v1/claim-verify",
                  "name": "capi2 Claim Verify",
                  "protocol": "x402",
                  "http_method": "POST",
                  "probe_body": json.dumps({"vendor_url": "https://example.com/security", "claim": "Vendor states that customer data is encrypted at rest."}),
                  "description": "Evidence-backed vendor claim verification for AI agents, procurement, due diligence, RFP and security workflows.",
                  "price_usd": 0.01,
                  "payment_asset": "USDC",
                  "payment_network": "Base",
                  "category": "ai/vendor-risk",
                  "provider": "capi2",
                  "contact_email": "capi2@agentmail.to",
              },
              {
                  "url": "https://capi2-demand-tools.onrender.com/v1/hash/sha256",
                  "name": "capi2 SHA-256",
                  "protocol": "x402",
                  "http_method": "POST",
                  "probe_body": json.dumps({"text": "hello agent"}),
                  "description": "Low-cost SHA-256 checksum and digest utility for autonomous agents.",
                  "price_usd": 0.001,
                  "payment_asset": "USDC",
                  "payment_network": "Base",
                  "category": "developer-tools/hashing",
                  "provider": "capi2",
                  "contact_email": "capi2@agentmail.to",
              },
              {
                  "url": "https://capi2-demand-tools.onrender.com/v1/hash/sha512",
                  "name": "capi2 SHA-512",
                  "protocol": "x402",
                  "http_method": "POST",
                  "probe_body": json.dumps({"text": "hello agent"}),
                  "description": "Low-cost SHA-512 checksum and digest utility for autonomous agents.",
                  "price_usd": 0.001,
                  "payment_asset": "USDC",
                  "payment_network": "Base",
                  "category": "developer-tools/hashing",
                  "provider": "capi2",
                  "contact_email": "capi2@agentmail.to",
              },
              {
                  "url": "https://capi2-demand-tools.onrender.com/v1/base64/encode",
                  "name": "capi2 Base64 Encode",
                  "protocol": "x402",
                  "http_method": "POST",
                  "probe_body": json.dumps({"text": "hello agent"}),
                  "description": "Low-cost Base64 encoding utility for API payloads and autonomous-agent workflows.",
                  "price_usd": 0.001,
                  "payment_asset": "USDC",
                  "payment_network": "Base",
                  "category": "developer-tools/encoding",
                  "provider": "capi2",
                  "contact_email": "capi2@agentmail.to",
              },
              {
                  "url": "https://capi2-demand-tools.onrender.com/v1/base64/decode",
                  "name": "capi2 Base64 Decode",
                  "protocol": "x402",
                  "http_method": "POST",
                  "probe_body": json.dumps({"data": "aGVsbG8gYWdlbnQ=", "urlsafe": False}),
                  "description": "Low-cost Base64 and Base64URL decoding utility for autonomous-agent workflows.",
                  "price_usd": 0.001,
                  "payment_asset": "USDC",
                  "payment_network": "Base",
                  "category": "developer-tools/encoding",
                  "provider": "capi2",
                  "contact_email": "capi2@agentmail.to",
              },
              {
                  "url": "https://capi2-demand-tools.onrender.com/v1/jwt/decode",
                  "name": "capi2 JWT Decode",
                  "protocol": "x402",
                  "http_method": "POST",
                  "probe_body": json.dumps({"token": "eyJhbGciOiJub25lIn0.eyJzdWIiOiIxMjMifQ."}),
                  "description": "Low-cost JWT header and claims decoding for token inspection and debugging; no signature verification.",
                  "price_usd": 0.001,
                  "payment_asset": "USDC",
                  "payment_network": "Base",
                  "category": "developer-tools/auth",
                  "provider": "capi2",
                  "contact_email": "capi2@agentmail.to",
              },
              {
                  "url": "https://capi2-demand-tools.onrender.com/v1/json/canonicalize",
                  "name": "capi2 JSON Canonical",
                  "protocol": "x402",
                  "http_method": "POST",
                  "probe_body": json.dumps({"value": {"b": 2, "a": 1}}),
                  "description": "Low-cost deterministic JSON canonicalization for stable hashing, signing and comparison.",
                  "price_usd": 0.001,
                  "payment_asset": "USDC",
                  "payment_network": "Base",
                  "category": "developer-tools/json",
                  "provider": "capi2",
                  "contact_email": "capi2@agentmail.to",
              },
          ]

          endpoint = "https://402index.io/api/v1/register"
          for item in registrations:
              data = json.dumps(item).encode()
              req = urllib.request.Request(endpoint, data=data, headers={"Content-Type": "application/json", "User-Agent": "capi2-directory-distributor/1.0"}, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read().decode("utf-8", "replace")
                      print(f"402INDEX {item['name']}: HTTP {resp.status} {body[:1200]}")
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  print(f"402INDEX {item['name']}: HTTP {exc.code} {body[:1200]}")
              except Exception as exc:
                  print(f"402INDEX {item['name']}: ERROR {type(exc).__name__}: {exc}")
          PY

      - name: Submit capi2 endpoints to Market402
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          urls = [
              "https://capi2-claim-verify.onrender.com/v1/claim-verify",
              "https://capi2-demand-tools.onrender.com/v1/hash/sha256",
              "https://capi2-demand-tools.onrender.com/v1/hash/sha512",
              "https://capi2-demand-tools.onrender.com/v1/base64/encode",
              "https://capi2-demand-tools.onrender.com/v1/base64/decode",
              "https://capi2-demand-tools.onrender.com/v1/jwt/decode",
              "https://capi2-demand-tools.onrender.com/v1/json/canonicalize",
          ]

          endpoint = "https://market402.com/submit"
          for url in urls:
              payload = json.dumps({"url": url}).encode()
              req = urllib.request.Request(endpoint, data=payload, headers={"Content-Type": "application/json", "User-Agent": "capi2-directory-distributor/1.0"}, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read().decode("utf-8", "replace")
                      print(f"MARKET402 {url}: HTTP {resp.status} {body[:1200]}")
                      continue
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  print(f"MARKET402 JSON {url}: HTTP {exc.code} {body[:800]}")
                  if exc.code not in (400, 404, 415, 422):
                      continue
              except Exception as exc:
                  print(f"MARKET402 JSON {url}: ERROR {type(exc).__name__}: {exc}")
                  continue

              form = urllib.parse.urlencode({"url": url}).encode()
              req = urllib.request.Request(endpoint, data=form, headers={"Content-Type": "application/x-www-form-urlencoded", "User-Agent": "capi2-directory-distributor/1.0"}, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read().decode("utf-8", "replace")
                      print(f"MARKET402 FORM {url}: HTTP {resp.status} {body[:1200]}")
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  print(f"MARKET402 FORM {url}: HTTP {exc.code} {body[:1200]}")
              except Exception as exc:
                  print(f"MARKET402 FORM {url}: ERROR {type(exc).__name__}: {exc}")
          PY

      - name: Audit x402scan discovery readiness
        shell: bash
        continue-on-error: true
        run: |
          echo '=== CLAIM VERIFY DISCOVERY ==='
          npx -y @agentcash/discovery@latest discover https://capi2-claim-verify.onrender.com || true
          echo '=== DEMAND TOOLS DISCOVERY ==='
          npx -y @agentcash/discovery@latest discover https://capi2-demand-tools.onrender.com || true

      - name: Check x402.direct crawl visibility
        shell: bash
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, urllib.request
          url = "https://x402.direct/api/services?limit=100&sort=newest"
          try:
              with urllib.request.urlopen(url, timeout=30) as resp:
                  data = json.load(resp)
              text = json.dumps(data).lower()
              print("X402DIRECT capi2_visible=", "capi2" in text)
          except Exception as exc:
              print("X402DIRECT check error:", type(exc).__name__, exc)
          PY
