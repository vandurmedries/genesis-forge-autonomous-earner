name: capi2 wholesale smoke

on:
  push:
    branches: [main]
    paths:
      - capi2/commerce_router/wholesale.py
      - .github/workflows/capi2-wholesale-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for health
        shell: bash
        run: |
          set -euo pipefail
          url='https://capi2-wholesale-router.onrender.com/health'
          for i in $(seq 1 24); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$url" || true)
            if [ "$code" = '200' ]; then
              cat /tmp/health.json
              exit 0
            fi
            echo "health attempt $i -> HTTP $code"
            sleep 10
          done
          echo 'health never reached HTTP 200'
          cat /tmp/health.json || true
          exit 1

      - name: Cheapest wholesale quote
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            code=$(curl -sS -o /tmp/quote.json -w '%{http_code}' \
              -X POST 'https://capi2-wholesale-router.onrender.com/v1/wholesale/quote' \
              -H 'content-type: application/json' \
              --data '{"task":"domain intelligence for example.com","include":"external","top":5}' || true)
            cat /tmp/quote.json || true
            tier=$(jq -r '.selected_tier // empty' /tmp/quote.json 2>/dev/null || true)
            price=$(jq -r '.buyer_price_usd // empty' /tmp/quote.json 2>/dev/null || true)
            underlying=$(jq -r '.underlying_tool_price_usd // empty' /tmp/quote.json 2>/dev/null || true)
            if [ "$code" = '200' ] && [ "$tier" = 'base' ] && [ "$price" = '0.011' ] && [ "$underlying" = '0.005' ]; then
              exit 0
            fi
            echo "quote attempt $i -> HTTP $code tier=$tier price=$price underlying=$underlying"
            sleep 10
          done
          echo 'cheapest quote did not converge to base tier'
          exit 1

      - name: Unpaid execute must challenge with 402
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/execute.json -w '%{http_code}' \
            -X POST 'https://capi2-wholesale-router.onrender.com/v1/wholesale/execute' \
            -H 'content-type: application/json' \
            --data '{"task":"domain intelligence for example.com","params":{"domain":"example.com"},"include":"external"}')
          cat /tmp/execute.json
          echo "HTTP $code"
          test "$code" = '402'
