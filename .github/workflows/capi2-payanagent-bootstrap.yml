name: capi2 PayanAgent bootstrap

on:
  pull_request:
    paths:
      - 'capi2/trigger/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register-and-list:
    runs-on: ubuntu-latest
    steps:
      - name: Register capi2 and create A2A offers
        shell: bash
        env:
          PAYOUT_WALLET: '0x4B4031bd3B334e010E6ecE66d14DEa59eB34122a'
        run: |
          set -euo pipefail

          AGENT_PAYLOAD=$(jq -n --arg wallet "$PAYOUT_WALLET" --arg run "$GITHUB_RUN_ID" '{
            name:("capi2-a2a-" + $run),
            description:"Agent-to-agent vendor evidence, procurement/compliance due diligence, RFP/security triage, and commercial-readiness workflows.",
            walletAddress:$wallet,
            chain:"base",
            tags:["vendor-risk","procurement","compliance","due-diligence","rfp","research","a2a"],
            providerType:"agent",
            ownerEmail:"capi2@agentmail.to"
          }')

          AGENT_RESP=$(curl --fail-with-body -sS -X POST https://payanagent.com/api/v1/agents \
            -H 'Content-Type: application/json' \
            --data "$AGENT_PAYLOAD")

          API_KEY=$(printf '%s' "$AGENT_RESP" | jq -r '.apiKey')
          AGENT_ID=$(printf '%s' "$AGENT_RESP" | jq -r '.agentId')
          test -n "$API_KEY" && test "$API_KEY" != "null"
          test -n "$AGENT_ID" && test "$AGENT_ID" != "null"

          create_offer() {
            local title="$1" description="$2" category="$3" tags_json="$4" cents="$5" file_url="$6"
            local payload response offer_id
            payload=$(jq -n \
              --arg title "$title" \
              --arg description "$description" \
              --arg category "$category" \
              --argjson tags "$tags_json" \
              --argjson cents "$cents" \
              --arg fileUrl "$file_url" \
              '{title:$title,description:$description,category:$category,tags:$tags,priceCents:$cents,offerType:"download",fileUrl:$fileUrl}')
            response=$(curl --fail-with-body -sS -X POST https://payanagent.com/api/v1/offers \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer $API_KEY" \
              --data "$payload")
            offer_id=$(printf '%s' "$response" | jq -r '.offerId // ._id // .id')
            test -n "$offer_id" && test "$offer_id" != "null"
            echo "CAPI2_OFFER_ID=$offer_id title=$title"
          }

          echo "CAPI2_AGENT_ID=$AGENT_ID"

          create_offer \
            'Claim Evidence Pack — vendor claim verification schema' \
            'Machine-readable evidence rules, input/output schema and routing logic for verifying one public vendor claim. Built for procurement, RFP, vendor-security and contract agents.' \
            'Research' \
            '["claim-verification","vendor-risk","procurement","rfp","evidence"]' \
            50 \
            'https://raw.githubusercontent.com/vandurmedries/genesis-forge-autonomous-earner/main/capi2/products/claim-evidence-pack-v1.json'

          create_offer \
            'Security Questionnaire Triage Pack' \
            'Machine-readable workflow to cluster security/privacy questionnaire items, identify blockers and evidence gaps, suggest owners and route follow-up work without fabricating controls.' \
            'Security' \
            '["security-questionnaire","vendor-security","compliance","rfp","triage"]' \
            190 \
            'https://raw.githubusercontent.com/vandurmedries/genesis-forge-autonomous-earner/main/capi2/products/security-questionnaire-triage-pack-v1.json'

          create_offer \
            'Vendor Due Diligence Workflow — 20 public-evidence checks' \
            'Procurement/vendor-risk workflow with 20 public evidence checks, risk output schema, buyer questions and specialist routing for AI, SaaS and technology vendors.' \
            'Business' \
            '["due-diligence","procurement","vendor-risk","compliance","ai-governance"]' \
            490 \
            'https://raw.githubusercontent.com/vandurmedries/genesis-forge-autonomous-earner/main/capi2/products/vendor-due-diligence-workflow-v1.json'

          echo 'CAPI2_BOOTSTRAP_OK=true'
