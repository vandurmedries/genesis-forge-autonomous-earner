name: capi2 x402 CI

on:
  push:
    branches: [main]
    paths:
      - "capi2/x402_service/**"
      - "render.yaml"
      - ".github/workflows/capi2-x402-ci.yml"
  pull_request:
    paths:
      - "capi2/x402_service/**"
      - "render.yaml"
      - ".github/workflows/capi2-x402-ci.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capi2/x402_service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: capi2/x402_service/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q .

      - name: Import FastAPI app
        run: |
          python - <<'PY'
          import app
          assert app.NETWORK == "eip155:8453"
          assert app.PRICE.startswith("$")
          assert any(getattr(route, "path", None) == "/v1/claim-verify" for route in app.app.routes)
          print("capi2 x402 service import OK")
          PY
