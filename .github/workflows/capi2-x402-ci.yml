name: capi2 x402 CI

on:
  push:
    branches: [main]
    paths:
      - "capi2/x402_service/**"
      - "render.yaml"
      - ".github/workflows/capi2-x402-ci.yml"
  pull_request:
    paths:
      - "capi2/x402_service/**"
      - "render.yaml"
      - ".github/workflows/capi2-x402-ci.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: capi2/x402_service/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r capi2/x402_service/requirements.txt

      - name: Compile
        run: python -m compileall -q capi2/x402_service

      - name: Import production FastAPI sales module
        env:
          PYTHONPATH: ${{ github.workspace }}/capi2/x402_service
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          from fastapi.testclient import TestClient
          import sales_app as service

          print("python import path: Render rootDir sales module")
          print("x402:", metadata.version("x402"))
          print("fastapi:", metadata.version("fastapi"))

          assert service.NETWORK == "eip155:8453"
          assert service.PRICE == "$0.01"

          route_paths = {getattr(route, "path", None) for route in service.app.routes}
          required_paths = {
              "/health",
              "/.well-known/x402",
              "/.well-known/agent.json",
              "/v1/quote",
              "/v1/claim-verify",
              "/v1/buyer-catalog",
              "/v1/vendor-security-check",
              "/v1/procurement-claim-check",
              "/v1/data-clause-check",
          }
          missing = required_paths - route_paths
          assert not missing, f"missing FastAPI routes: {sorted(missing)}"

          client = TestClient(service.app)
          health = client.get("/health")
          assert health.status_code == 200, health.text
          assert health.json().get("ok") is True

          catalog = client.get("/v1/buyer-catalog")
          assert catalog.status_code == 200, catalog.text
          assert len(catalog.json().get("resources", [])) == 3

          schema = client.get("/openapi.json").json()
          for path in service.SALES_INTENTS:
              op = schema["paths"][path]["post"]
              assert "x-payment-info" in op, path
              assert "402" in op["responses"], path
              assert op["x-payment-info"]["network"] == "eip155:8453"
              assert op["x-payment-info"]["asset"] == "USDC"

          print("capi2 high-intent x402 sales surface smoke checks OK")
          PY
