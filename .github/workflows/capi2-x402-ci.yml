name: capi2 x402 CI

on:
  push:
    branches: [main]
    paths:
      - "capi2/x402_service/**"
      - "capi2/runtime/**"
      - "sitecustomize.py"
      - "usercustomize.py"
      - "render.yaml"
      - ".github/workflows/capi2-x402-ci.yml"
  pull_request:
    paths:
      - "capi2/x402_service/**"
      - "capi2/runtime/**"
      - "sitecustomize.py"
      - "usercustomize.py"
      - "render.yaml"
      - ".github/workflows/capi2-x402-ci.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: capi2/x402_service/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r capi2/x402_service/requirements.txt

      - name: Compile
        run: python -m compileall -q capi2/x402_service capi2/runtime sitecustomize.py usercustomize.py

      - name: Validate Render-equivalent package and x402scan discovery
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import importlib
          import importlib.metadata as metadata
          from fastapi.testclient import TestClient

          # Import through the package exactly as Render does with
          # `uvicorn capi2.x402_service.app:app`. Package initialization loads
          # sales_app and the deterministic x402scan discovery contract while
          # repo-root sitecustomize/usercustomize are also active.
          service = importlib.import_module("capi2.x402_service.app")
          sales = importlib.import_module("capi2.x402_service.sales_app")
          api = service.app

          print("python import path: Render-equivalent package")
          print("x402:", metadata.version("x402"))
          print("fastapi:", metadata.version("fastapi"))

          assert service.NETWORK == "eip155:8453"
          assert service.PRICE == "$0.01"
          assert service.SERVICE_VERSION == "1.6.1"

          multi_source = service.ClaimVerifyRequest(
              source_urls=["https://example.com/security", "https://example.org/privacy"],
              claim="Customer data is encrypted at rest.",
          )
          assert len(multi_source.resolved_urls()) == 2
          for field in ("request_id", "checked_at", "sources_checked", "source_results"):
              assert field in service.CLAIM_OUTPUT_SCHEMA["required"], field

          original_fetch = service._fetch_public_source
          def fake_fetch(url):
              if "support.example" in url:
                  text = "Customer data is encrypted at rest using AES-256 for all stored production records."
              elif "deny.example" in url:
                  text = "Customer data at rest is stored in plaintext. This policy applies to all production records."
              else:
                  raise service.HTTPException(status_code=422, detail="source_http_status:404")
              return url, f"<html><body>{text}</body></html>"

          service._fetch_public_source = fake_fetch
          conflicting = service._execute_claim_verify(service.ClaimVerifyRequest(
              source_urls=[
                  "https://support.example/security",
                  "https://deny.example/security",
                  "https://broken.example/security",
              ],
              claim="Customer data is encrypted at rest.",
          ))
          service._fetch_public_source = original_fetch
          assert conflicting.verdict == "CONFLICTING_SUPPLIED_SOURCES"
          assert conflicting.verification_status == "uncertain"
          assert conflicting.sources_checked == 2
          assert all(item.source_url for item in conflicting.evidence)

          route_paths = {getattr(route, "path", None) for route in api.routes}
          required_paths = {
              "/health",
              "/.well-known/x402",
              "/.well-known/x402-service.json",
              "/.well-known/agent.json",
              "/v1/quote",
              "/v1/claim-verify",
              "/v1/buyer-catalog",
              "/v1/vendor-security-check",
              "/v1/procurement-claim-check",
              "/v1/data-clause-check",
          }
          missing = required_paths - route_paths
          assert not missing, f"missing FastAPI routes: {sorted(missing)}"

          client = TestClient(api)
          health = client.get("/health")
          assert health.status_code == 200, health.text
          assert health.json().get("ok") is True

          true402_manifest = client.get("/.well-known/x402-service.json")
          assert true402_manifest.status_code == 200, true402_manifest.text
          assert true402_manifest.json()["version"] == "1.6.1"

          quote = client.get("/v1/quote")
          assert quote.status_code == 200, quote.text
          quote_json = quote.json()
          assert quote_json["production_proof"]["transaction"].endswith("c38fb")
          assert quote_json["production_proof"]["scope"].endswith("not an organic customer sale")
          assert quote_json["not_for"]

          openapi_response = client.get("/openapi.json")
          assert openapi_response.status_code == 200, openapi_response.text
          schema = openapi_response.json()
          assert schema.get("openapi") == "3.1.0"
          assert schema.get("x-capi2-static-discovery") is True
          assert schema["info"].get("x-guidance"), "missing info.x-guidance"
          assert schema["info"].get("contact", {}).get("email") == "capi2@agentmail.to"

          paid_paths = ["/v1/claim-verify", *sales.SALES_INTENTS.keys()]
          assert set(schema["paths"]) == set(paid_paths)
          for path in paid_paths:
              op = schema["paths"][path]["post"]
              assert op.get("requestBody", {}).get("content", {}).get("application/json", {}).get("schema"), path
              assert op.get("responses", {}).get("200", {}).get("content", {}).get("application/json", {}).get("schema"), path
              assert "402" in op["responses"], path
              payment = op["x-payment-info"]
              assert payment["price"] == {"mode": "fixed", "currency": "USD", "amount": "0.01"}, path
              assert payment["protocols"] == [{"x402": {}}], path
              assert payment["network"] == "eip155:8453", path
              assert payment["asset"] == "USDC", path

          print("capi2 Render-equivalent OpenAPI + strict x402scan discovery checks OK")
          PY
